<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AttendEase — Sign In</title>
  
  <!-- CSS Dependencies -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  
  <style>
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
      z-index: 10;
    }
    .login-card {
      width: 100%;
      max-width: 440px;
      padding: 2.5rem 2.25rem;
      border-radius: var(--radius-xl);
    }
    .role-tabs {
      display: flex;
      background: rgba(255, 255, 255, 0.06);
      padding: 4px;
      border-radius: var(--radius-md);
      border: 1px solid var(--glass-border);
      margin-bottom: 1.75rem;
      gap: 4px;
    }
    .role-tab-btn {
      flex: 1;
      padding: 8px 10px;
      font-size: 0.82rem;
      font-family: var(--font-heading);
      font-weight: 600;
      color: var(--text-muted);
      border: none;
      background: transparent;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all var(--transition-fast);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .role-tab-btn.active {
      background: linear-gradient(135deg, var(--burgundy), var(--rose));
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(100, 27, 50, 0.5);
    }
    .demo-creds-btn {
      font-size: 0.76rem;
      padding: 4px 8px;
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      color: var(--blush);
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    .demo-creds-btn:hover {
      background: rgba(143, 48, 79, 0.3);
      color: #ffffff;
    }
  </style>
</head>
<body>

  <!-- Ambient Light Effect -->
  <div class="ambient">
    <div class="ambient-blob blob-1"></div>
    <div class="ambient-blob blob-2"></div>
    <div class="ambient-blob blob-3"></div>
  </div>

  <div class="login-wrapper">
    <div class="glass-dark login-card">
      <div class="text-center mb-4">
        <svg width="48" height="48" viewBox="0 0 40 40" fill="none" class="mb-2">
          <rect width="40" height="40" rx="10" fill="url(#loginBrandGrad)"/>
          <path d="M20 10L9 16L20 22L31 16L20 10Z" stroke="#FFF7F8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M13 18.2V25.5C13 25.5 16 28 20 28C24 28 27 25.5 27 25.5V18.2" stroke="#FFF7F8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M29 18V24" stroke="#FFF7F8" stroke-width="2" stroke-linecap="round"/>
          <defs>
            <linearGradient id="loginBrandGrad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
              <stop stop-color="#8F304F"/>
              <stop offset="1" stop-color="#3B1022"/>
            </linearGradient>
          </defs>
        </svg>
        <h2 class="h4 mb-1">Attend<span style="color: var(--rose-muted);">Ease</span></h2>
        <p class="text-muted small mb-0">Smart Student Attendance Management System</p>
      </div>

      <!-- Role Selector Tabs -->
      <div class="role-tabs">
        <button type="button" class="role-tab-btn active" data-role="STUDENT" id="tabStudent">
          <i class="fa-solid fa-user-graduate"></i> Student
        </button>
        <button type="button" class="role-tab-btn" data-role="FACULTY" id="tabFaculty">
          <i class="fa-solid fa-chalkboard-user"></i> Faculty
        </button>
        <button type="button" class="role-tab-btn" data-role="ADMIN" id="tabAdmin">
          <i class="fa-solid fa-shield-halved"></i> Admin
        </button>
      </div>

      <!-- Error Alert -->
      <div id="loginError" class="alert-glass d-none mb-3">
        <i class="fa-solid fa-circle-exclamation text-danger"></i>
        <div id="loginErrorMessage" class="small"></div>
      </div>

      <!-- Login Form -->
      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label" for="emailInput">Institutional Email</label>
          <div class="input-group">
            <span class="input-group-text"><i class="fa-regular fa-envelope"></i></span>
            <input type="email" class="form-control" id="emailInput" placeholder="rollno@attendease.com" required>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label d-flex justify-content-between align-items-center" for="passwordInput">
            <span>Password</span>
            <button type="button" class="btn btn-link p-0 text-muted" id="togglePasswordBtn" style="font-size: 0.78rem;">
              <i class="fa-regular fa-eye"></i> Show
            </button>
          </label>
          <div class="input-group">
            <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
            <input type="password" class="form-control" id="passwordInput" placeholder="Enter password" required>
          </div>
        </div>

        <button type="submit" class="btn btn-burgundy w-100 py-2 mb-3 mt-2" id="submitBtn">
          <span>Sign In</span> <i class="fa-solid fa-arrow-right-to-bracket"></i>
        </button>
      </form>

      <!-- Demo Quick Fill Helpers -->
      <div class="pt-3 border-top border-light border-opacity-10 text-center">
        <div class="text-muted mb-2" style="font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em;">Quick Demo Credentials</div>
        <div class="d-flex justify-content-center gap-2 flex-wrap">
          <button type="button" class="demo-creds-btn" onclick="fillDemo('student1@attendease.com', 'Student@123', 'STUDENT')">
            Student 1
          </button>
          <button type="button" class="demo-creds-btn" onclick="fillDemo('faculty1@attendease.com', 'Faculty@123', 'FACULTY')">
            Faculty 1
          </button>
          <button type="button" class="demo-creds-btn" onclick="fillDemo('admin@attendease.com', 'Admin@123', 'ADMIN')">
            Admin
          </button>
        </div>
      </div>

    </div>
  </div>

  <script>
    let selectedRole = 'STUDENT';

    // Segmented tab switching
    document.querySelectorAll('.role-tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.role-tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedRole = btn.getAttribute('data-role');
        hideError();
      });
    });

    // Password visibility toggle
    const pwdInput = document.getElementById('passwordInput');
    const toggleBtn = document.getElementById('togglePasswordBtn');
    toggleBtn.addEventListener('click', () => {
      const isPwd = pwdInput.type === 'password';
      pwdInput.type = isPwd ? 'text' : 'password';
      toggleBtn.innerHTML = isPwd ? '<i class="fa-regular fa-eye-slash"></i> Hide' : '<i class="fa-regular fa-eye"></i> Show';
    });

    function fillDemo(email, pwd, role) {
      document.getElementById('emailInput').value = email;
      document.getElementById('passwordInput').value = pwd;
      selectedRole = role;
      document.querySelectorAll('.role-tab-btn').forEach(b => {
        if (b.getAttribute('data-role') === role) b.classList.add('active');
        else b.classList.remove('active');
      });
      hideError();
    }

    function showError(msg) {
      const errEl = document.getElementById('loginError');
      const msgEl = document.getElementById('loginErrorMessage');
      msgEl.textContent = msg;
      errEl.classList.remove('d-none');
    }

    function hideError() {
      document.getElementById('loginError').classList.add('d-none');
    }

    // Form submission
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideError();

      const email = document.getElementById('emailInput').value.trim();
      const password = document.getElementById('passwordInput').value;
      const submitBtn = document.getElementById('submitBtn');

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Signing In...';

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, role: selectedRole })
        });

        const data = await response.json();

        if (response.ok) {
          window.location.href = data.redirectUrl;
        } else {
          showError(data.message || 'Login failed. Please check credentials and portal role.');
        }
      } catch (err) {
        showError('Unable to connect to server. Please ensure the backend is running.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Sign In</span> <i class="fa-solid fa-arrow-right-to-bracket"></i>';
      }
    });
  </script>
</body>
</html>
