<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — AttendEase</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 p-3">

  <div class="ambient">
    <div class="ambient-blob blob-1"></div>
    <div class="ambient-blob blob-2"></div>
    <div class="ambient-blob blob-3"></div>
  </div>

  <div class="glass-dark text-center p-5" style="max-width: 460px; border-radius: var(--radius-xl); position: relative; z-index: 10;">
    <div class="stat-icon mx-auto mb-3" style="width: 64px; height: 64px; font-size: 1.8rem; background: rgba(233, 185, 110, 0.2); color: var(--warning); border-color: rgba(233, 185, 110, 0.4);">
      <i class="fa-solid fa-compass"></i>
    </div>
    <h1 class="h3 text-white mb-2">404 — Resource Missing</h1>
    <p class="text-muted small mb-4">
      The collegiate portal URL or academic resource you requested could not be located on the server.
    </p>
    <div class="d-flex justify-content-center gap-2">
      <a href="/login.html" class="btn btn-burgundy btn-sm">
        <i class="fa-solid fa-house me-1"></i> Return Home
      </a>
    </div>
  </div>

</body>
</html>
