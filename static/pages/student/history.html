<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance History — AttendEase</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
</head>
<body>

  <div class="app-wrapper">
    <aside class="sidebar" id="appSidebar"></aside>

    <div class="main-wrapper">
      <header class="top-navbar" id="topNavbar"></header>

      <main class="page-container">
        
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div>
            <h1 class="h4 mb-1">Attendance History & Records</h1>
            <p class="text-muted small mb-0">Detailed session-by-session log with filtering and grievance escalation.</p>
          </div>
          <a href="/pages/student/reports.html" class="btn btn-sm btn-glass">
            <i class="fa-solid fa-file-arrow-down me-1"></i> Export Log
          </a>
        </div>

        <!-- Filter Controls Bar -->
        <div class="glass-card mb-4" style="padding: 1.25rem;">
          <form id="filterForm" class="row g-3 align-items-end">
            <div class="col-12 col-md-4">
              <label class="form-label">Subject</label>
              <select class="form-select" id="filterSubject">
                <option value="">All Subjects</option>
              </select>
            </div>
            <div class="col-6 col-md-3">
              <label class="form-label">From Date</label>
              <input type="date" class="form-control" id="filterStartDate">
            </div>
            <div class="col-6 col-md-3">
              <label class="form-label">To Date</label>
              <input type="date" class="form-control" id="filterEndDate">
            </div>
            <div class="col-12 col-md-2 d-flex gap-2">
              <button type="submit" class="btn btn-burgundy w-100">
                <i class="fa-solid fa-filter me-1"></i> Filter
              </button>
              <button type="button" class="btn btn-glass" id="resetBtn" title="Reset Filters">
                <i class="fa-solid fa-rotate-right"></i>
              </button>
            </div>
          </form>
        </div>

        <!-- Attendance Records Glass Table -->
        <div class="glass-table-container">
          <div class="p-3 border-bottom border-light border-opacity-10 d-flex justify-content-between align-items-center">
            <h2 class="h6 mb-0 text-white"><i class="fa-solid fa-clock-rotate-left me-2 text-muted"></i>Session Audit Log</h2>
            <span class="text-muted small" id="recordCountText">Loading sessions...</span>
          </div>
          <div class="table-responsive">
            <table class="glass-table">
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Subject</th>
                  <th>Status</th>
                  <th>Marked By</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="historyTableBody">
                <tr><td colspan="5" class="text-center py-4 text-muted"><div class="skeleton-row w-75 mx-auto"></div></td></tr>
              </tbody>
            </table>
          </div>
        </div>

      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await AppLayout.init('history', 'STUDENT');
      await loadSubjectOptions();
      loadHistory();
    });

    async function loadSubjectOptions() {
      try {
        const res = await fetch('/api/student/dashboard');
        if (!res.ok) return;
        const data = await res.json();
        const sel = document.getElementById('filterSubject');
        data.subjectStats.forEach(s => {
          const opt = document.createElement('option');
          opt.value = s.subjectId;
          opt.textContent = `${s.subjectName} (${s.subjectCode})`;
          sel.appendChild(opt);
        });
      } catch (e) {
        console.error(e);
      }
    }

    async function loadHistory() {
      const subjectId = document.getElementById('filterSubject').value;
      const startDate = document.getElementById('filterStartDate').value;
      const endDate = document.getElementById('filterEndDate').value;

      const params = new URLSearchParams();
      if (subjectId) params.append('subjectId', subjectId);
      if (startDate) params.append('startDate', startDate);
      if (endDate) params.append('endDate', endDate);

      try {
        const res = await fetch(`/api/student/history?${params.toString()}`);
        if (!res.ok) throw new Error('Failed to load history');
        const records = await res.json();

        document.getElementById('recordCountText').textContent = `${records.length} Recorded Session${records.length === 1 ? '' : 's'}`;

        const tbody = document.getElementById('historyTableBody');
        if (records.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-muted">No attendance sessions found matching the filter criteria.</td></tr>';
          return;
        }

        tbody.innerHTML = records.map(r => {
          const isPresent = r.status === 'PRESENT';
          const badgeClass = isPresent ? 'badge-status-green' : 'badge-status-red';
          const actionBtn = !isPresent ? `
            <a href="/pages/student/complaints.html?attendanceId=${r.id}&subjectId=${r.subjectId}&date=${r.date}" class="btn btn-sm btn-glass text-nowrap" title="Dispute this absence">
              <i class="fa-solid fa-shield-halved me-1"></i> Dispute
            </a>
          ` : '<span class="text-muted" style="font-size: 0.78rem;">Verified</span>';

          return `
            <tr>
              <td>
                <div class="fw-semibold text-white">${new Date(r.date).toLocaleDateString(undefined, { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' })}</div>
              </td>
              <td>
                <div class="fw-bold text-white">${r.subjectName}</div>
                <small class="text-muted">${r.subjectCode}</small>
              </td>
              <td>
                <span class="badge ${badgeClass}">${r.status}</span>
              </td>
              <td>
                <span class="text-light">${r.markedByName || 'Department Faculty'}</span>
              </td>
              <td>${actionBtn}</td>
            </tr>
          `;
        }).join('');

      } catch (e) {
        console.error(e);
        AppLayout.showToast('Error loading attendance logs', 'error');
      }
    }

    document.getElementById('filterForm').addEventListener('submit', (e) => {
      e.preventDefault();
      loadHistory();
    });

    document.getElementById('resetBtn').addEventListener('click', () => {
      document.getElementById('filterSubject').value = '';
      document.getElementById('filterStartDate').value = '';
      document.getElementById('filterEndDate').value = '';
      loadHistory();
    });
  </script>
</body>
</html>
