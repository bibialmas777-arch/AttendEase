<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Dashboard — AttendEase</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
</head>
<body>

  <div class="app-wrapper">
    <!-- Collapsible Sidebar -->
    <aside class="sidebar" id="appSidebar"></aside>

    <div class="main-wrapper">
      <!-- Top Sticky Navbar -->
      <header class="top-navbar" id="topNavbar"></header>

      <!-- Main Page Content -->
      <main class="page-container">
        
        <!-- Attendance Defaulter Warning Banner (Driven by Java) -->
        <div id="warningBanner" class="alert-glass mb-4 d-none">
          <i class="fa-solid fa-triangle-exclamation text-warning" style="font-size: 1.4rem;"></i>
          <div class="flex-grow-1" id="warningBannerText"></div>
          <a href="/pages/student/recovery.html" class="btn btn-sm btn-burgundy text-nowrap">Open Recovery Planner</a>
        </div>

        <!-- Metric Stat Cards Grid -->
        <div class="row g-3 mb-4">
          <!-- Overall Attendance Circular Gauge -->
          <div class="col-12 col-md-6 col-xl-3">
            <div class="glass-card text-center h-100 d-flex flex-column justify-content-between">
              <div class="stat-label">
                <span>Overall Attendance</span>
                <i class="fa-solid fa-chart-pie stat-icon"></i>
              </div>
              <div id="circleProgressContainer" class="py-2"></div>
              <div class="stat-subtext mt-1" id="thresholdNotice">Required Minimum: 75%</div>
            </div>
          </div>

          <!-- Classes Attended -->
          <div class="col-12 col-sm-6 col-xl-3">
            <div class="stat-card h-100">
              <div class="stat-label">
                <span>Classes Attended</span>
                <i class="fa-solid fa-circle-check stat-icon" style="background: rgba(117, 201, 163, 0.2); color: var(--success); border-color: rgba(117, 201, 163, 0.4);"></i>
              </div>
              <div>
                <div class="stat-value text-success" id="statAttended">-</div>
                <div class="stat-subtext">Verified present sessions</div>
              </div>
            </div>
          </div>

          <!-- Classes Missed -->
          <div class="col-12 col-sm-6 col-xl-3">
            <div class="stat-card h-100">
              <div class="stat-label">
                <span>Classes Missed</span>
                <i class="fa-solid fa-circle-xmark stat-icon" style="background: rgba(240, 120, 137, 0.2); color: var(--danger); border-color: rgba(240, 120, 137, 0.4);"></i>
              </div>
              <div>
                <div class="stat-value text-danger" id="statMissed">-</div>
                <div class="stat-subtext">Absent or leave sessions</div>
              </div>
            </div>
          </div>

          <!-- Total Classes Conducted -->
          <div class="col-12 col-sm-6 col-xl-3">
            <div class="stat-card h-100">
              <div class="stat-label">
                <span>Total Conducted</span>
                <i class="fa-solid fa-graduation-cap stat-icon"></i>
              </div>
              <div>
                <div class="stat-value" id="statConducted">-</div>
                <div class="stat-subtext" id="statPendingGrievance">0 Pending Grievances</div>
              </div>
            </div>
          </div>
        </div>

        <!-- Subject-Wise Attendance Overview & Chart -->
        <div class="row g-4 mb-4">
          <!-- Subject Performance Table -->
          <div class="col-12 col-xl-8">
            <div class="glass-table-container h-100">
              <div class="p-3 border-bottom border-light border-opacity-10 d-flex justify-content-between align-items-center">
                <h3 class="h6 mb-0 text-white"><i class="fa-solid fa-book me-2 text-muted"></i>Subject-Wise Attendance</h3>
                <a href="/pages/student/recovery.html" class="btn btn-sm btn-glass">
                  <i class="fa-solid fa-calculator"></i> Planner
                </a>
              </div>
              <div class="table-responsive">
                <table class="glass-table">
                  <thead>
                    <tr>
                      <th>Subject</th>
                      <th>Conducted</th>
                      <th>Attended</th>
                      <th>Percentage</th>
                      <th>Status</th>
                      <th>Action</th>
                    </tr>
                  </thead>
                  <tbody id="subjectTableBody">
                    <tr><td colspan="6" class="text-center py-4 text-muted"><div class="skeleton-row w-75 mx-auto"></div></td></tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>

          <!-- Subject Comparison Bar Chart -->
          <div class="col-12 col-xl-4">
            <div class="glass-card h-100 d-flex flex-column">
              <div class="d-flex justify-content-between align-items-center mb-3">
                <h3 class="h6 mb-0 text-white"><i class="fa-solid fa-chart-column me-2 text-muted"></i>Subject Distribution</h3>
              </div>
              <div class="flex-grow-1" style="min-height: 250px;">
                <canvas id="subjectChart"></canvas>
              </div>
            </div>
          </div>
        </div>

      </main>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
  <script src="/js/chartTheme.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    let subjectChartInstance = null;

    document.addEventListener('DOMContentLoaded', async () => {
      await AppLayout.init('dashboard', 'STUDENT');
      loadDashboard();
    });

    async function loadDashboard() {
      try {
        const response = await fetch('/api/student/dashboard');
        if (!response.ok) throw new Error('Failed to load dashboard data');
        const data = await response.json();

        // Warning banner
        const banner = document.getElementById('warningBanner');
        if (data.warningBanner) {
          banner.classList.remove('d-none');
          document.getElementById('warningBannerText').textContent = data.warningMessage;
        } else {
          banner.classList.add('d-none');
        }

        // Render circular progress gauge
        AppLayout.renderCircleProgress('circleProgressContainer', data.overallPercentage, data.overallStatus);
        document.getElementById('thresholdNotice').textContent = `College Minimum: ${data.systemThreshold.toFixed(0)}%`;

        // Metric values
        document.getElementById('statAttended').textContent = data.overallAttended;
        document.getElementById('statMissed').textContent = data.overallMissed;
        document.getElementById('statConducted').textContent = data.overallConducted;
        document.getElementById('statPendingGrievance').textContent = `${data.pendingComplaintsCount} Pending Grievance${data.pendingComplaintsCount === 1 ? '' : 's'}`;

        // Populate Subject Table
        const tbody = document.getElementById('subjectTableBody');
        if (!data.subjectStats || data.subjectStats.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4 text-muted">No attendance recorded yet.</td></tr>';
          return;
        }

        tbody.innerHTML = data.subjectStats.map(s => {
          let badgeClass = 'badge-status-green';
          let progressColorClass = 'progress-bar-green';
          if (s.statusColor === 'YELLOW') {
            badgeClass = 'badge-status-yellow';
            progressColorClass = 'progress-bar-yellow';
          } else if (s.statusColor === 'RED') {
            badgeClass = 'badge-status-red';
            progressColorClass = 'progress-bar-red';
          }

          return `
            <tr>
              <td>
                <div class="fw-bold text-white">${s.subjectName}</div>
                <small class="text-muted">${s.subjectCode}</small>
              </td>
              <td>${s.conducted}</td>
              <td>${s.attended}</td>
              <td style="min-width: 140px;">
                <div class="d-flex justify-content-between mb-1" style="font-size: 0.82rem;">
                  <span class="fw-semibold">${s.percentage.toFixed(1)}%</span>
                </div>
                <div class="progress">
                  <div class="progress-bar ${progressColorClass}" style="width: ${Math.min(100, s.percentage)}%"></div>
                </div>
              </td>
              <td>
                <span class="badge ${badgeClass}">${s.statusColor}</span>
              </td>
              <td>
                <a href="/pages/student/recovery.html?subjectId=${s.subjectId}" class="btn btn-sm btn-glass text-nowrap" title="Calculate recovery for this subject">
                  <i class="fa-solid fa-arrow-trend-up"></i> Plan
                </a>
              </td>
            </tr>
          `;
        }).join('');

        // Render Bar Chart
        renderSubjectChart(data.subjectStats);

      } catch (err) {
        AppLayout.showToast('Failed to load attendance dashboard', 'error');
        console.error(err);
      }
    }

    function renderSubjectChart(subjectStats) {
      const ctx = document.getElementById('subjectChart');
      if (!ctx) return;

      if (subjectChartInstance) {
        subjectChartInstance.destroy();
      }

      const labels = subjectStats.map(s => s.subjectCode);
      const percentages = subjectStats.map(s => s.percentage);
      const backgroundColors = subjectStats.map(s => {
        if (s.statusColor === 'GREEN') return '#75C9A3';
        if (s.statusColor === 'YELLOW') return '#E9B96E';
        return '#F07889';
      });

      subjectChartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{
            label: 'Attendance %',
            data: percentages,
            backgroundColor: backgroundColors,
            borderRadius: 6
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false }
          },
          scales: {
            y: {
              beginAtZero: true,
              max: 100,
              grid: { color: 'rgba(255, 255, 255, 0.08)' }
            },
            x: {
              grid: { display: false }
            }
          }
        }
      });
    }
  </script>
</body>
</html>
