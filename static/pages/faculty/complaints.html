<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Review Grievances — AttendEase</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
</head>
<body>

  <div class="app-wrapper">
    <aside class="sidebar" id="appSidebar"></aside>

    <div class="main-wrapper">
      <header class="top-navbar" id="topNavbar"></header>

      <main class="page-container">
        
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div>
            <h1 class="h4 mb-1">Student Attendance Grievances</h1>
            <p class="text-muted small mb-0">Adjudicate dispute requests for your assigned teaching courses.</p>
          </div>
        </div>

        <div class="glass-table-container">
          <div class="p-3 border-bottom border-light border-opacity-10 d-flex justify-content-between align-items-center">
            <h2 class="h6 mb-0 text-white"><i class="fa-solid fa-file-signature me-2 text-muted"></i>Grievance Queue</h2>
            <span class="text-muted small" id="grievanceCount">Loading requests...</span>
          </div>
          <div class="table-responsive">
            <table class="glass-table">
              <thead>
                <tr>
                  <th>Roll No</th>
                  <th>Student Name</th>
                  <th>Course</th>
                  <th>Date</th>
                  <th>Change</th>
                  <th>Reason</th>
                  <th>Status</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="grievancesTableBody">
                <tr><td colspan="8" class="text-center py-4 text-muted"><div class="skeleton-row w-75 mx-auto"></div></td></tr>
              </tbody>
            </table>
          </div>
        </div>

      </main>
    </div>
  </div>

  <!-- Review Modal -->
  <div class="modal fade" id="reviewModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title h6 text-white"><i class="fa-solid fa-gavel me-2 text-rose"></i>Adjudicate Grievance</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="reviewForm">
          <div class="modal-body">
            <input type="hidden" id="reviewGrievanceId">

            <div class="p-3 mb-3 rounded-3" style="background: rgba(255, 255, 255, 0.04); border: 1px solid var(--glass-border);">
              <div class="d-flex justify-content-between mb-1">
                <span class="text-muted small">Student:</span>
                <strong class="text-white" id="modalStudent">-</strong>
              </div>
              <div class="d-flex justify-content-between mb-1">
                <span class="text-muted small">Course:</span>
                <span class="text-light" id="modalSubject">-</span>
              </div>
              <div class="d-flex justify-content-between mb-1">
                <span class="text-muted small">Lecture Date:</span>
                <span class="text-light" id="modalDate">-</span>
              </div>
              <div class="d-flex justify-content-between mb-1">
                <span class="text-muted small">Requested Change:</span>
                <span id="modalChangeBadge">-</span>
              </div>
              <div class="mt-2 pt-2 border-top border-light border-opacity-10">
                <span class="text-muted small d-block mb-1">Student's Stated Reason:</span>
                <p class="small text-light mb-0" id="modalReason" style="font-style: italic;">-</p>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">Review Decision</label>
              <select class="form-select" id="reviewDecision" required>
                <option value="APPROVED">APPROVE (Update attendance to Requested Status)</option>
                <option value="UNDER_REVIEW">UNDER REVIEW (Request additional documentation)</option>
                <option value="REJECTED">REJECT (Maintain recorded status)</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label" for="reviewRemarks">Faculty Remarks</label>
              <textarea class="form-control" id="reviewRemarks" rows="3" placeholder="Enter remarks that will be saved in audit logs and sent to the student..." required></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-glass btn-sm" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-burgundy btn-sm" id="submitReviewBtn">Commit Decision</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    let reviewModalInstance = null;
    let grievancesList = [];

    document.addEventListener('DOMContentLoaded', async () => {
      await AppLayout.init('complaints', 'FACULTY');
      reviewModalInstance = new bootstrap.Modal(document.getElementById('reviewModal'));
      loadGrievances();
    });

    async function loadGrievances() {
      try {
        const res = await fetch('/api/faculty/complaints');
        if (!res.ok) throw new Error('Failed to load grievances');
        grievancesList = await res.json();

        document.getElementById('grievanceCount').textContent = `${grievancesList.length} Total Grievances`;

        const tbody = document.getElementById('grievancesTableBody');
        if (grievancesList.length === 0) {
          tbody.innerHTML = '<tr><td colspan="8" class="text-center py-4 text-muted">No attendance grievances pending for your assigned courses.</td></tr>';
          return;
        }

        tbody.innerHTML = grievancesList.map(g => {
          let badgeClass = 'badge-status-yellow';
          if (g.status === 'APPROVED') badgeClass = 'badge-status-green';
          if (g.status === 'REJECTED') badgeClass = 'badge-status-red';
          if (g.status === 'PENDING') badgeClass = 'badge-status-info';

          const isActionable = g.status === 'PENDING' || g.status === 'UNDER_REVIEW';

          return `
            <tr>
              <td><strong class="text-white">${g.rollNo}</strong></td>
              <td>${g.studentName}</td>
              <td>
                <div>${g.subjectName}</div>
                <small class="text-muted">${g.subjectCode}</small>
              </td>
              <td>${g.date}</td>
              <td>
                <span class="badge ${g.currentStatus === 'PRESENT' ? 'badge-status-green' : 'badge-status-red'}">${g.currentStatus}</span>
                <i class="fa-solid fa-arrow-right mx-1 text-muted" style="font-size: 0.7rem;"></i>
                <span class="badge ${g.requestedStatus === 'PRESENT' ? 'badge-status-green' : 'badge-status-red'}">${g.requestedStatus}</span>
              </td>
              <td style="max-width: 200px;">
                <div class="text-truncate" title="${g.reason}">${g.reason}</div>
              </td>
              <td>
                <span class="badge ${badgeClass}">${g.status}</span>
              </td>
              <td>
                <button class="btn btn-sm ${isActionable ? 'btn-burgundy' : 'btn-glass'} text-nowrap" onclick="openReviewModal(${g.id})">
                  ${isActionable ? '<i class="fa-solid fa-gavel me-1"></i> Review' : '<i class="fa-solid fa-eye me-1"></i> View'}
                </button>
              </td>
            </tr>
          `;
        }).join('');

      } catch (e) {
        console.error(e);
        AppLayout.showToast('Could not load grievances', 'error');
      }
    }

    function openReviewModal(id) {
      const g = grievancesList.find(item => item.id === id);
      if (!g) return;

      document.getElementById('reviewGrievanceId').value = g.id;
      document.getElementById('modalStudent').textContent = `${g.studentName} (${g.rollNo})`;
      document.getElementById('modalSubject').textContent = `${g.subjectName} (${g.subjectCode})`;
      document.getElementById('modalDate').textContent = g.date;
      document.getElementById('modalChangeBadge').innerHTML = `
        <span class="badge ${g.currentStatus === 'PRESENT' ? 'badge-status-green' : 'badge-status-red'}">${g.currentStatus}</span>
        &rarr;
        <span class="badge ${g.requestedStatus === 'PRESENT' ? 'badge-status-green' : 'badge-status-red'}">${g.requestedStatus}</span>
      `;
      document.getElementById('modalReason').textContent = `"${g.reason}"`;
      document.getElementById('reviewRemarks').value = g.facultyRemarks || '';
      if (g.status === 'APPROVED' || g.status === 'REJECTED' || g.status === 'UNDER_REVIEW') {
        document.getElementById('reviewDecision').value = g.status;
      } else {
        document.getElementById('reviewDecision').value = 'APPROVED';
      }

      reviewModalInstance.show();
    }

    document.getElementById('reviewForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const id = document.getElementById('reviewGrievanceId').value;
      const status = document.getElementById('reviewDecision').value;
      const remarks = document.getElementById('reviewRemarks').value.trim();

      const btn = document.getElementById('submitReviewBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Committing...';

      try {
        const res = await fetch(`/api/faculty/complaints/${id}/review`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status, remarks })
        });

        if (res.ok) {
          AppLayout.showToast(`Grievance marked as ${status}. Records and audit logs updated.`, 'success');
          reviewModalInstance.hide();
          loadGrievances();
        } else {
          const err = await res.json();
          AppLayout.showToast(err.message || 'Review failed', 'error');
        }
      } catch (err) {
        console.error(err);
        AppLayout.showToast('Network error while committing decision', 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'Commit Decision';
      }
    });
  </script>
</body>
</html>
