<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mark Attendance — AttendEase</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
  <style>
    .status-toggle-btn {
      min-width: 90px;
      font-weight: 700;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <div class="app-wrapper">
    <aside class="sidebar" id="appSidebar"></aside>

    <div class="main-wrapper">
      <header class="top-navbar" id="topNavbar"></header>

      <main class="page-container">
        
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
          <div>
            <h1 class="h4 mb-1">Mark Lecture Attendance</h1>
            <p class="text-muted small mb-0">Record lecture attendance for your designated section cohorts.</p>
          </div>
          <div class="d-flex gap-2">
            <button type="button" class="btn btn-sm btn-glass" id="markAllPresentBtn">
              <i class="fa-solid fa-check-double me-1 text-success"></i> Mark All Present
            </button>
            <button type="button" class="btn btn-sm btn-glass" id="markAllAbsentBtn">
              <i class="fa-solid fa-xmark me-1 text-danger"></i> Mark All Absent
            </button>
          </div>
        </div>

        <!-- Session Selection Form -->
        <div class="glass-card mb-4" style="padding: 1.25rem;">
          <form id="sessionForm" class="row g-3 align-items-end">
            <div class="col-12 col-md-5">
              <label class="form-label">Course & Section Assignment</label>
              <select class="form-select" id="assignmentSelect" required>
                <option value="">Select assigned course and section...</option>
              </select>
            </div>
            <div class="col-12 col-md-4">
              <label class="form-label">Lecture Date</label>
              <input type="date" class="form-control" id="attendanceDate" required>
            </div>
            <div class="col-12 col-md-3">
              <button type="submit" class="btn btn-burgundy w-100" id="loadRosterBtn">
                <i class="fa-solid fa-users-viewfinder me-1"></i> Load Student Roster
              </button>
            </div>
          </form>
        </div>

        <!-- Student Roster Table -->
        <div class="glass-table-container mb-4">
          <div class="p-3 border-bottom border-light border-opacity-10 d-flex justify-content-between align-items-center">
            <h2 class="h6 mb-0 text-white"><i class="fa-solid fa-id-card-clip me-2 text-muted"></i>Student Roll Roster</h2>
            <span class="text-muted small" id="rosterCountText">Select course and date above</span>
          </div>
          <div class="table-responsive">
            <table class="glass-table">
              <thead>
                <tr>
                  <th style="width: 80px;">#</th>
                  <th>Roll Number</th>
                  <th>Student Name</th>
                  <th>Class / Section</th>
                  <th style="width: 180px;" class="text-center">Attendance Status</th>
                </tr>
              </thead>
              <tbody id="rosterTableBody">
                <tr>
                  <td colspan="5" class="text-center py-5 text-muted">
                    <i class="fa-solid fa-clipboard-user fs-2 mb-2 d-block text-rose-muted opacity-50"></i>
                    Select your assigned course and date above, then click <strong>Load Student Roster</strong>.
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- Submit Bar -->
        <div class="d-flex justify-content-between align-items-center p-3 glass-card d-none" id="submitBar">
          <div class="text-muted small" id="tallySummary">
            Present: <strong class="text-success" id="presentTally">0</strong> | Absent: <strong class="text-danger" id="absentTally">0</strong>
          </div>
          <button type="button" class="btn btn-burgundy" id="saveAttendanceBtn">
            <i class="fa-solid fa-floppy-disk me-1"></i> Submit & Save to Database
          </button>
        </div>

      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    let assignments = [];
    let currentStudents = [];
    let studentStatusMap = {}; // studentId -> 'PRESENT' | 'ABSENT'
    let currentSelectedAssignment = null;

    document.addEventListener('DOMContentLoaded', async () => {
      await AppLayout.init('mark', 'FACULTY');
      
      // Default to today's date
      document.getElementById('attendanceDate').value = new Date().toISOString().split('T')[0];

      await loadAssignments();

      // Check URL params
      const urlParams = new URLSearchParams(window.location.search);
      const subId = urlParams.get('subjectId');
      const secId = urlParams.get('sectionId');
      if (subId && secId) {
        const found = assignments.find(a => a.subjectId == subId && a.sectionId == secId);
        if (found) {
          document.getElementById('assignmentSelect').value = found.id;
          loadRoster();
        }
      }
    });

    async function loadAssignments() {
      try {
        const res = await fetch('/api/faculty/assignments');
        if (!res.ok) throw new Error('Failed to load assignments');
        assignments = await res.json();

        const sel = document.getElementById('assignmentSelect');
        assignments.forEach(a => {
          const opt = document.createElement('option');
          opt.value = a.id;
          opt.textContent = `${a.subjectName} (${a.subjectCode}) — ${a.className} [${a.sectionName}]`;
          sel.appendChild(opt);
        });
      } catch (e) {
        console.error(e);
        AppLayout.showToast('Could not load course assignments', 'error');
      }
    }

    document.getElementById('sessionForm').addEventListener('submit', (e) => {
      e.preventDefault();
      loadRoster();
    });

    async function loadRoster() {
      const assignmentId = document.getElementById('assignmentSelect').value;
      const dateVal = document.getElementById('attendanceDate').value;

      if (!assignmentId || !dateVal) return;

      currentSelectedAssignment = assignments.find(a => a.id == assignmentId);
      if (!currentSelectedAssignment) return;

      const loadBtn = document.getElementById('loadRosterBtn');
      loadBtn.disabled = true;
      loadBtn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Loading...';

      try {
        // First check if attendance is already recorded for this day
        const existingRes = await fetch(`/api/faculty/attendance/day?subjectId=${currentSelectedAssignment.subjectId}&sectionId=${currentSelectedAssignment.sectionId}&date=${dateVal}`);
        const existingData = await existingRes.json();

        if (existingData && existingData.length > 0) {
          AppLayout.showToast('Notice: Attendance for this session has already been recorded. Use "Class History" to edit past records.', 'warning');
        }

        // Fetch students enrolled in this section
        const res = await fetch(`/api/faculty/students?sectionId=${currentSelectedAssignment.sectionId}`);
        currentStudents = await res.json();

        document.getElementById('rosterCountText').textContent = `${currentStudents.length} Students in ${currentSelectedAssignment.sectionName}`;

        const tbody = document.getElementById('rosterTableBody');
        if (currentStudents.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-muted">No students enrolled in this section.</td></tr>';
          document.getElementById('submitBar').classList.add('d-none');
          return;
        }

        // Initialize status map: default PRESENT
        studentStatusMap = {};
        currentStudents.forEach(s => {
          studentStatusMap[s.studentId] = 'PRESENT';
        });

        renderRosterRows();
        document.getElementById('submitBar').classList.remove('d-none');
        updateTallies();

      } catch (e) {
        console.error(e);
        AppLayout.showToast('Failed to load student roster', 'error');
      } finally {
        loadBtn.disabled = false;
        loadBtn.innerHTML = '<i class="fa-solid fa-users-viewfinder me-1"></i> Load Student Roster';
      }
    }

    function renderRosterRows() {
      const tbody = document.getElementById('rosterTableBody');
      tbody.innerHTML = currentStudents.map((s, idx) => {
        const isPresent = studentStatusMap[s.studentId] === 'PRESENT';
        return `
          <tr>
            <td>${idx + 1}</td>
            <td><strong class="text-white">${s.rollNo}</strong></td>
            <td>${s.name}</td>
            <td>${s.className} ${s.sectionName}</td>
            <td class="text-center">
              <button type="button" 
                class="btn btn-sm status-toggle-btn ${isPresent ? 'btn-success' : 'btn-danger'}" 
                onclick="toggleStudentStatus(${s.studentId})">
                ${isPresent ? '<i class="fa-solid fa-check me-1"></i> Present' : '<i class="fa-solid fa-xmark me-1"></i> Absent'}
              </button>
            </td>
          </tr>
        `;
      }).join('');
    }

    function toggleStudentStatus(studentId) {
      studentStatusMap[studentId] = (studentStatusMap[studentId] === 'PRESENT') ? 'ABSENT' : 'PRESENT';
      renderRosterRows();
      updateTallies();
    }

    document.getElementById('markAllPresentBtn').addEventListener('click', () => {
      currentStudents.forEach(s => studentStatusMap[s.studentId] = 'PRESENT');
      renderRosterRows();
      updateTallies();
    });

    document.getElementById('markAllAbsentBtn').addEventListener('click', () => {
      currentStudents.forEach(s => studentStatusMap[s.studentId] = 'ABSENT');
      renderRosterRows();
      updateTallies();
    });

    function updateTallies() {
      let p = 0, a = 0;
      Object.values(studentStatusMap).forEach(v => {
        if (v === 'PRESENT') p++;
        else a++;
      });
      document.getElementById('presentTally').textContent = p;
      document.getElementById('absentTally').textContent = a;
    }

    document.getElementById('saveAttendanceBtn').addEventListener('click', async () => {
      if (!currentSelectedAssignment) return;

      const dateVal = document.getElementById('attendanceDate').value;
      const records = currentStudents.map(s => ({
        studentId: s.studentId,
        status: studentStatusMap[s.studentId]
      }));

      const payload = {
        classId: currentSelectedAssignment.classId,
        sectionId: currentSelectedAssignment.sectionId,
        subjectId: currentSelectedAssignment.subjectId,
        date: dateVal,
        records: records
      };

      const btn = document.getElementById('saveAttendanceBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Saving...';

      try {
        const res = await fetch('/api/faculty/attendance/mark', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          AppLayout.showToast('Attendance recorded and committed to MySQL successfully!', 'success');
          setTimeout(() => {
            window.location.href = '/pages/faculty/history.html';
          }, 1200);
        } else {
          const err = await res.json();
          AppLayout.showToast(err.message || 'Failed to submit attendance', 'error');
        }
      } catch (err) {
        console.error(err);
        AppLayout.showToast('Error communicating with server', 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-floppy-disk me-1"></i> Submit & Save to Database';
      }
    });
  </script>
</body>
</html>
