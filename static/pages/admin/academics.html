<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Academics & Curriculum — AttendEase</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
</head>
<body>

  <div class="app-wrapper">
    <aside class="sidebar" id="appSidebar"></aside>

    <div class="main-wrapper">
      <header class="top-navbar" id="topNavbar"></header>

      <main class="page-container">
        
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div>
            <h1 class="h4 mb-1">Academic Classes & Curriculum Courses</h1>
            <p class="text-muted small mb-0">Directory of departmental classes, section divisions, and credit courses.</p>
          </div>
        </div>

        <div class="row g-4 mb-4">
          <!-- Classes and Sections Table -->
          <div class="col-12 col-lg-5">
            <div class="glass-table-container h-100">
              <div class="p-3 border-bottom border-light border-opacity-10">
                <h2 class="h6 mb-0 text-white"><i class="fa-solid fa-graduation-cap me-2 text-muted"></i>Classes & Sections</h2>
              </div>
              <div class="table-responsive">
                <table class="glass-table">
                  <thead>
                    <tr>
                      <th>Class Code</th>
                      <th>Class Name</th>
                      <th>Sections</th>
                    </tr>
                  </thead>
                  <tbody id="classesTableBody">
                    <tr><td colspan="3" class="text-center py-4 text-muted"><div class="skeleton-row w-75 mx-auto"></div></td></tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>

          <!-- Subjects / Courses Table -->
          <div class="col-12 col-lg-7">
            <div class="glass-table-container h-100">
              <div class="p-3 border-bottom border-light border-opacity-10">
                <h2 class="h6 mb-0 text-white"><i class="fa-solid fa-book-open me-2 text-muted"></i>Curriculum Courses</h2>
              </div>
              <div class="table-responsive">
                <table class="glass-table">
                  <thead>
                    <tr>
                      <th>Course Code</th>
                      <th>Subject Name</th>
                      <th>Class</th>
                      <th>Credits</th>
                    </tr>
                  </thead>
                  <tbody id="subjectsTableBody">
                    <tr><td colspan="4" class="text-center py-4 text-muted"><div class="skeleton-row w-75 mx-auto"></div></td></tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>

      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await AppLayout.init('academics', 'ADMIN');
      loadAcademics();
    });

    async function loadAcademics() {
      try {
        const classesRes = await fetch('/api/admin/classes');
        const classes = await classesRes.json();

        const classesTbody = document.getElementById('classesTableBody');
        const subjectsTbody = document.getElementById('subjectsTableBody');

        let classesHtml = '';
        let allSubjects = [];

        for (const c of classes) {
          const secRes = await fetch(`/api/admin/sections?classId=${c.id}`);
          const sections = await secRes.json();
          const secBadges = sections.map(s => `<span class="badge badge-status-yellow me-1">${s.name}</span>`).join('');

          classesHtml += `
            <tr>
              <td><span class="badge badge-status-info">${c.code}</span></td>
              <td><strong class="text-white">${c.name}</strong></td>
              <td>${secBadges || '<span class="text-muted small">None</span>'}</td>
            </tr>
          `;

          const subRes = await fetch(`/api/admin/subjects?classId=${c.id}`);
          const subjects = await subRes.json();
          subjects.forEach(s => s.className = c.name);
          allSubjects.push(...subjects);
        }

        classesTbody.innerHTML = classesHtml || '<tr><td colspan="3" class="text-center py-4 text-muted">No classes found.</td></tr>';

        if (allSubjects.length === 0) {
          subjectsTbody.innerHTML = '<tr><td colspan="4" class="text-center py-4 text-muted">No curriculum subjects found.</td></tr>';
        } else {
          subjectsTbody.innerHTML = allSubjects.map(s => `
            <tr>
              <td><span class="badge badge-status-info">${s.code}</span></td>
              <td><strong class="text-white">${s.name}</strong></td>
              <td>${s.className}</td>
              <td><span class="badge badge-status-green">${s.credits || 3} Credits</span></td>
            </tr>
          `).join('');
        }

      } catch (e) {
        console.error(e);
        AppLayout.showToast('Could not load academic curriculum', 'error');
      }
    }
  </script>
</body>
</html>
