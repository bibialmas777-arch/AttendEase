<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Students — AttendEase</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
</head>
<body>

  <div class="app-wrapper">
    <aside class="sidebar" id="appSidebar"></aside>

    <div class="main-wrapper">
      <header class="top-navbar" id="topNavbar"></header>

      <main class="page-container">
        
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
          <div>
            <h1 class="h4 mb-1">Student Records Management</h1>
            <p class="text-muted small mb-0">Maintain student directory, enrollment records, and active credentials.</p>
          </div>
          <button class="btn btn-burgundy btn-sm" onclick="openStudentModal()">
            <i class="fa-solid fa-user-plus me-1"></i> Add Student
          </button>
        </div>

        <!-- Search Bar -->
        <div class="glass-card mb-4" style="padding: 1rem 1.25rem;">
          <div class="row g-2 align-items-center">
            <div class="col-12 col-md-6">
              <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-magnifying-glass"></i></span>
                <input type="text" class="form-control" id="searchStudentInput" placeholder="Search by name, roll number, or email...">
              </div>
            </div>
            <div class="col-12 col-md-6 text-md-end text-muted small" id="studentSummaryText">
              Loading student roster...
            </div>
          </div>
        </div>

        <!-- Students Glass Table -->
        <div class="glass-table-container">
          <div class="table-responsive">
            <table class="glass-table">
              <thead>
                <tr>
                  <th>Roll No</th>
                  <th>Student Name</th>
                  <th>Institutional Email</th>
                  <th>Class</th>
                  <th>Section</th>
                  <th>Phone</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="studentTableBody">
                <tr><td colspan="8" class="text-center py-4 text-muted"><div class="skeleton-row w-75 mx-auto"></div></td></tr>
              </tbody>
            </table>
          </div>
        </div>

      </main>
    </div>
  </div>

  <!-- Student Add/Edit Modal -->
  <div class="modal fade" id="studentModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title h6 text-white" id="studentModalTitle">Add New Student</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="studentForm">
          <div class="modal-body">
            <input type="hidden" id="studentId">

            <div class="mb-3">
              <label class="form-label" for="studentNameInput">Full Legal Name</label>
              <input type="text" class="form-control" id="studentNameInput" required>
            </div>

            <div class="row g-2 mb-3">
              <div class="col-6">
                <label class="form-label" for="studentRollInput">Roll Number</label>
                <input type="text" class="form-control" id="studentRollInput" placeholder="22CS101" required>
              </div>
              <div class="col-6">
                <label class="form-label" for="studentPhoneInput">Phone Contact</label>
                <input type="text" class="form-control" id="studentPhoneInput" placeholder="+91 98...">
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label" for="studentEmailInput">Email Address</label>
              <input type="email" class="form-control" id="studentEmailInput" placeholder="rollno@attendease.com" required>
            </div>

            <div class="mb-3">
              <label class="form-label" for="studentPasswordInput">Password (Leave blank to keep current)</label>
              <input type="password" class="form-control" id="studentPasswordInput" placeholder="Default: Student@123">
            </div>

            <div class="row g-2 mb-3">
              <div class="col-6">
                <label class="form-label" for="studentClassSelect">Class</label>
                <select class="form-select" id="studentClassSelect" required>
                  <option value="">Select class...</option>
                </select>
              </div>
              <div class="col-6">
                <label class="form-label" for="studentSectionSelect">Section</label>
                <select class="form-select" id="studentSectionSelect" required>
                  <option value="">Select section...</option>
                </select>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-glass btn-sm" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-burgundy btn-sm" id="saveStudentBtn">Save Record</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    let studentModalInstance = null;
    let allStudents = [];
    let classes = [];

    document.addEventListener('DOMContentLoaded', async () => {
      await AppLayout.init('students', 'ADMIN');
      studentModalInstance = new bootstrap.Modal(document.getElementById('studentModal'));
      await loadClasses();
      loadStudents();

      document.getElementById('studentClassSelect').addEventListener('change', async (e) => {
        await loadSections(e.target.value);
      });

      document.getElementById('searchStudentInput').addEventListener('input', (e) => {
        filterTable(e.target.value.toLowerCase());
      });
    });

    async function loadClasses() {
      try {
        const res = await fetch('/api/admin/classes');
        classes = await res.json();
        const sel = document.getElementById('studentClassSelect');
        sel.innerHTML = '<option value="">Select class...</option>' + 
          classes.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
      } catch (e) {
        console.error(e);
      }
    }

    async function loadSections(classId, selectedSectionId = null) {
      const sel = document.getElementById('studentSectionSelect');
      if (!classId) {
        sel.innerHTML = '<option value="">Select section...</option>';
        return;
      }
      try {
        const res = await fetch(`/api/admin/sections?classId=${classId}`);
        const sections = await res.json();
        sel.innerHTML = '<option value="">Select section...</option>' + 
          sections.map(s => `<option value="${s.id}" ${selectedSectionId == s.id ? 'selected' : ''}>${s.name}</option>`).join('');
      } catch (e) {
        console.error(e);
      }
    }

    async function loadStudents() {
      try {
        const res = await fetch('/api/admin/students');
        if (!res.ok) throw new Error('Failed to load students');
        allStudents = await res.json();
        document.getElementById('studentSummaryText').textContent = `${allStudents.length} Students Registered`;
        renderStudents(allStudents);
      } catch (e) {
        console.error(e);
        AppLayout.showToast('Could not load students directory', 'error');
      }
    }

    function renderStudents(students) {
      const tbody = document.getElementById('studentTableBody');
      if (students.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" class="text-center py-4 text-muted">No students found.</td></tr>';
        return;
      }

      tbody.innerHTML = students.map(s => `
        <tr class="${s.active ? '' : 'opacity-50'}">
          <td><strong class="text-white">${s.rollNo}</strong></td>
          <td>${s.name}</td>
          <td>${s.email}</td>
          <td>${s.className}</td>
          <td><span class="badge badge-status-info">${s.sectionName}</span></td>
          <td>${s.phone || '-'}</td>
          <td>
            <span class="badge ${s.active ? 'badge-status-green' : 'badge-status-red'}">${s.active ? 'ACTIVE' : 'INACTIVE'}</span>
          </td>
          <td>
            <div class="d-flex gap-1">
              <button class="btn btn-sm btn-glass btn-icon" onclick="openStudentModal(${s.id})" title="Edit Student">
                <i class="fa-solid fa-pen-to-square"></i>
              </button>
              ${s.active ? `
                <button class="btn btn-sm btn-danger btn-icon" onclick="deactivateStudent(${s.id}, '${s.name}')" title="Deactivate Student">
                  <i class="fa-solid fa-user-slash"></i>
                </button>
              ` : ''}
            </div>
          </td>
        </tr>
      `).join('');
    }

    function filterTable(query) {
      const filtered = allStudents.filter(s => 
        s.name.toLowerCase().includes(query) || 
        s.rollNo.toLowerCase().includes(query) || 
        s.email.toLowerCase().includes(query)
      );
      renderStudents(filtered);
    }

    async function openStudentModal(id = null) {
      document.getElementById('studentForm').reset();
      document.getElementById('studentId').value = '';

      if (id) {
        const s = allStudents.find(item => item.id === id);
        if (!s) return;
        document.getElementById('studentModalTitle').textContent = `Edit Student: ${s.rollNo}`;
        document.getElementById('studentId').value = s.id;
        document.getElementById('studentNameInput').value = s.name;
        document.getElementById('studentRollInput').value = s.rollNo;
        document.getElementById('studentPhoneInput').value = s.phone || '';
        document.getElementById('studentEmailInput').value = s.email;
        document.getElementById('studentClassSelect').value = s.classId;
        await loadSections(s.classId, s.sectionId);
      } else {
        document.getElementById('studentModalTitle').textContent = 'Add New Student';
      }

      studentModalInstance.show();
    }

    document.getElementById('studentForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const id = document.getElementById('studentId').value;
      const payload = {
        name: document.getElementById('studentNameInput').value.trim(),
        rollNo: document.getElementById('studentRollInput').value.trim(),
        phone: document.getElementById('studentPhoneInput').value.trim(),
        email: document.getElementById('studentEmailInput').value.trim(),
        password: document.getElementById('studentPasswordInput').value,
        classId: parseInt(document.getElementById('studentClassSelect').value),
        sectionId: parseInt(document.getElementById('studentSectionSelect').value)
      };

      const btn = document.getElementById('saveStudentBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Saving...';

      try {
        const method = id ? 'PUT' : 'POST';
        const url = id ? `/api/admin/students/${id}` : '/api/admin/students';

        const res = await fetch(url, {
          method: method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          AppLayout.showToast(`Student record ${id ? 'updated' : 'created'} successfully`, 'success');
          studentModalInstance.hide();
          loadStudents();
        } else {
          const err = await res.json();
          AppLayout.showToast(err.message || 'Operation failed', 'error');
        }
      } catch (err) {
        console.error(err);
        AppLayout.showToast('Network error while saving student', 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'Save Record';
      }
    });

    async function deactivateStudent(id, name) {
      if (!confirm(`Are you sure you want to deactivate ${name}? This performs a safe soft-delete without breaking attendance foreign keys.`)) {
        return;
      }

      try {
        const res = await fetch(`/api/admin/students/${id}`, { method: 'DELETE' });
        if (res.ok) {
          AppLayout.showToast(`Student ${name} deactivated successfully`, 'success');
          loadStudents();
        } else {
          const err = await res.json();
          AppLayout.showToast(err.message || 'Failed to deactivate student', 'error');
        }
      } catch (e) {
        console.error(e);
        AppLayout.showToast('Network error', 'error');
      }
    }
  </script>
</body>
</html>
