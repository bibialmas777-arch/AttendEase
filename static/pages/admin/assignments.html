<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faculty Assignments — AttendEase</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
</head>
<body>

  <div class="app-wrapper">
    <aside class="sidebar" id="appSidebar"></aside>

    <div class="main-wrapper">
      <header class="top-navbar" id="topNavbar"></header>

      <main class="page-container">
        
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
          <div>
            <h1 class="h4 mb-1">Faculty Course Assignments</h1>
            <p class="text-muted small mb-0">Authorize instructors to take attendance and adjudicate disputes for specific courses and sections.</p>
          </div>
          <button class="btn btn-burgundy btn-sm" onclick="openAssignmentModal()">
            <i class="fa-solid fa-plus me-1"></i> New Assignment
          </button>
        </div>

        <div class="glass-table-container">
          <div class="p-3 border-bottom border-light border-opacity-10 d-flex justify-content-between align-items-center">
            <h2 class="h6 mb-0 text-white"><i class="fa-solid fa-link me-2 text-muted"></i>Active Teaching Allocations</h2>
            <span class="text-muted small" id="assignmentCountText">Loading allocations...</span>
          </div>
          <div class="table-responsive">
            <table class="glass-table">
              <thead>
                <tr>
                  <th>Faculty Instructor</th>
                  <th>Course / Subject</th>
                  <th>Code</th>
                  <th>Class Program</th>
                  <th>Section</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="assignmentsTableBody">
                <tr><td colspan="6" class="text-center py-4 text-muted"><div class="skeleton-row w-75 mx-auto"></div></td></tr>
              </tbody>
            </table>
          </div>
        </div>

      </main>
    </div>
  </div>

  <!-- Assignment Modal -->
  <div class="modal fade" id="assignmentModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title h6 text-white"><i class="fa-solid fa-link me-2 text-rose"></i>Assign Faculty to Course</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="assignmentForm">
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label" for="assignFacultySelect">Faculty Instructor</label>
              <select class="form-select" id="assignFacultySelect" required>
                <option value="">Select faculty member...</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label" for="assignClassSelect">Class Program</label>
              <select class="form-select" id="assignClassSelect" required>
                <option value="">Select class...</option>
              </select>
            </div>

            <div class="row g-2 mb-3">
              <div class="col-6">
                <label class="form-label" for="assignSubjectSelect">Subject</label>
                <select class="form-select" id="assignSubjectSelect" required>
                  <option value="">Select subject...</option>
                </select>
              </div>
              <div class="col-6">
                <label class="form-label" for="assignSectionSelect">Section Cohort</label>
                <select class="form-select" id="assignSectionSelect" required>
                  <option value="">Select section...</option>
                </select>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-glass btn-sm" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-burgundy btn-sm" id="saveAssignmentBtn">Confirm Allocation</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    let assignmentModalInstance = null;
    let facultyList = [];
    let classList = [];

    document.addEventListener('DOMContentLoaded', async () => {
      await AppLayout.init('assignments', 'ADMIN');
      assignmentModalInstance = new bootstrap.Modal(document.getElementById('assignmentModal'));
      await loadPrerequisites();
      loadAssignments();

      document.getElementById('assignClassSelect').addEventListener('change', async (e) => {
        const classId = e.target.value;
        await loadSubjectsAndSectionsForClass(classId);
      });
    });

    async function loadPrerequisites() {
      try {
        const [facRes, clsRes] = await Promise.all([
          fetch('/api/admin/faculty'),
          fetch('/api/admin/classes')
        ]);
        facultyList = await facRes.json();
        classList = await clsRes.json();

        const facSel = document.getElementById('assignFacultySelect');
        facSel.innerHTML = '<option value="">Select faculty member...</option>' + 
          facultyList.map(f => `<option value="${f.id}">${f.name} (${f.department || 'CSE'})</option>`).join('');

        const clsSel = document.getElementById('assignClassSelect');
        clsSel.innerHTML = '<option value="">Select class...</option>' + 
          classList.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
      } catch (e) {
        console.error(e);
      }
    }

    async function loadSubjectsAndSectionsForClass(classId) {
      const subSel = document.getElementById('assignSubjectSelect');
      const secSel = document.getElementById('assignSectionSelect');

      if (!classId) {
        subSel.innerHTML = '<option value="">Select subject...</option>';
        secSel.innerHTML = '<option value="">Select section...</option>';
        return;
      }

      try {
        const [subRes, secRes] = await Promise.all([
          fetch(`/api/admin/subjects?classId=${classId}`),
          fetch(`/api/admin/sections?classId=${classId}`)
        ]);
        const subjects = await subRes.json();
        const sections = await secRes.json();

        subSel.innerHTML = '<option value="">Select subject...</option>' + 
          subjects.map(s => `<option value="${s.id}">${s.name} (${s.code})</option>`).join('');

        secSel.innerHTML = '<option value="">Select section...</option>' + 
          sections.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
      } catch (e) {
        console.error(e);
      }
    }

    async function loadAssignments() {
      try {
        const res = await fetch('/api/admin/assignments');
        if (!res.ok) throw new Error('Failed to load assignments');
        const list = await res.json();

        document.getElementById('assignmentCountText').textContent = `${list.length} Allocations Active`;

        const tbody = document.getElementById('assignmentsTableBody');
        if (list.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" class="text-center py-4 text-muted">No faculty teaching assignments defined yet.</td></tr>';
          return;
        }

        tbody.innerHTML = list.map(a => `
          <tr>
            <td><strong class="text-white">${a.facultyName}</strong></td>
            <td>${a.subjectName}</td>
            <td><span class="badge badge-status-info">${a.subjectCode}</span></td>
            <td>${a.className}</td>
            <td><span class="badge badge-status-yellow">${a.sectionName}</span></td>
            <td>
              <button class="btn btn-sm btn-danger btn-icon" onclick="deleteAssignment(${a.id}, '${a.facultyName}', '${a.subjectName}')" title="Revoke Assignment">
                <i class="fa-solid fa-trash-can"></i>
              </button>
            </td>
          </tr>
        `).join('');

      } catch (e) {
        console.error(e);
        AppLayout.showToast('Could not load course assignments', 'error');
      }
    }

    function openAssignmentModal() {
      document.getElementById('assignmentForm').reset();
      document.getElementById('assignSubjectSelect').innerHTML = '<option value="">Select subject...</option>';
      document.getElementById('assignSectionSelect').innerHTML = '<option value="">Select section...</option>';
      assignmentModalInstance.show();
    }

    document.getElementById('assignmentForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const payload = {
        facultyId: parseInt(document.getElementById('assignFacultySelect').value),
        subjectId: parseInt(document.getElementById('assignSubjectSelect').value),
        sectionId: parseInt(document.getElementById('assignSectionSelect').value)
      };

      const btn = document.getElementById('saveAssignmentBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Assigning...';

      try {
        const res = await fetch('/api/admin/assignments', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          AppLayout.showToast('Faculty assigned successfully and audit recorded', 'success');
          assignmentModalInstance.hide();
          loadAssignments();
        } else {
          const err = await res.json();
          AppLayout.showToast(err.message || 'Assignment failed', 'error');
        }
      } catch (err) {
        console.error(err);
        AppLayout.showToast('Network error while creating assignment', 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'Confirm Allocation';
      }
    });

    async function deleteAssignment(id, facultyName, subjectName) {
      if (!confirm(`Revoke teaching assignment: ${facultyName} for ${subjectName}?`)) {
        return;
      }

      try {
        const res = await fetch(`/api/admin/assignments/${id}`, { method: 'DELETE' });
        if (res.ok) {
          AppLayout.showToast('Assignment revoked successfully', 'success');
          loadAssignments();
        } else {
          const err = await res.json();
          AppLayout.showToast(err.message || 'Failed to revoke assignment', 'error');
        }
      } catch (e) {
        console.error(e);
        AppLayout.showToast('Network error', 'error');
      }
    }
  </script>
</body>
</html>
