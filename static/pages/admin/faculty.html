<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Faculty — AttendEase</title>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
</head>
<body>

  <div class="app-wrapper">
    <aside class="sidebar" id="appSidebar"></aside>

    <div class="main-wrapper">
      <header class="top-navbar" id="topNavbar"></header>

      <main class="page-container">
        
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
          <div>
            <h1 class="h4 mb-1">Faculty Directory Management</h1>
            <p class="text-muted small mb-0">Maintain instructor credentials, department affiliations, and teaching assignments.</p>
          </div>
          <button class="btn btn-burgundy btn-sm" onclick="openFacultyModal()">
            <i class="fa-solid fa-chalkboard-user me-1"></i> Add Faculty Member
          </button>
        </div>

        <div class="glass-table-container">
          <div class="p-3 border-bottom border-light border-opacity-10 d-flex justify-content-between align-items-center">
            <h2 class="h6 mb-0 text-white"><i class="fa-solid fa-users me-2 text-muted"></i>Faculty Staff Directory</h2>
            <span class="text-muted small" id="facultySummaryText">Loading staff...</span>
          </div>
          <div class="table-responsive">
            <table class="glass-table">
              <thead>
                <tr>
                  <th>Faculty Name</th>
                  <th>Institutional Email</th>
                  <th>Department</th>
                  <th>Phone Contact</th>
                  <th>Assigned Courses</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="facultyTableBody">
                <tr><td colspan="7" class="text-center py-4 text-muted"><div class="skeleton-row w-75 mx-auto"></div></td></tr>
              </tbody>
            </table>
          </div>
        </div>

      </main>
    </div>
  </div>

  <!-- Faculty Add/Edit Modal -->
  <div class="modal fade" id="facultyModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title h6 text-white" id="facultyModalTitle">Add Faculty Member</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="facultyForm">
          <div class="modal-body">
            <input type="hidden" id="facultyId">

            <div class="mb-3">
              <label class="form-label" for="facultyNameInput">Full Legal Name</label>
              <input type="text" class="form-control" id="facultyNameInput" required>
            </div>

            <div class="mb-3">
              <label class="form-label" for="facultyEmailInput">Institutional Email</label>
              <input type="email" class="form-control" id="facultyEmailInput" placeholder="faculty@attendease.com" required>
            </div>

            <div class="mb-3">
              <label class="form-label" for="facultyPasswordInput">Password (Leave blank to keep existing)</label>
              <input type="password" class="form-control" id="facultyPasswordInput" placeholder="Default: Faculty@123">
            </div>

            <div class="row g-2 mb-3">
              <div class="col-6">
                <label class="form-label" for="facultyDeptInput">Department</label>
                <input type="text" class="form-control" id="facultyDeptInput" placeholder="Computer Science" required>
              </div>
              <div class="col-6">
                <label class="form-label" for="facultyPhoneInput">Phone Contact</label>
                <input type="text" class="form-control" id="facultyPhoneInput" placeholder="+91 98...">
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-glass btn-sm" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-burgundy btn-sm" id="saveFacultyBtn">Save Record</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    let facultyModalInstance = null;
    let allFaculty = [];

    document.addEventListener('DOMContentLoaded', async () => {
      await AppLayout.init('faculty', 'ADMIN');
      facultyModalInstance = new bootstrap.Modal(document.getElementById('facultyModal'));
      loadFaculty();
    });

    async function loadFaculty() {
      try {
        const res = await fetch('/api/admin/faculty');
        if (!res.ok) throw new Error('Failed to load faculty');
        allFaculty = await res.json();
        document.getElementById('facultySummaryText').textContent = `${allFaculty.length} Instructors Registered`;
        renderFaculty(allFaculty);
      } catch (e) {
        console.error(e);
        AppLayout.showToast('Could not load faculty directory', 'error');
      }
    }

    function renderFaculty(list) {
      const tbody = document.getElementById('facultyTableBody');
      if (list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4 text-muted">No faculty members found.</td></tr>';
        return;
      }

      tbody.innerHTML = list.map(f => `
        <tr class="${f.active ? '' : 'opacity-50'}">
          <td><strong class="text-white">${f.name}</strong></td>
          <td>${f.email}</td>
          <td><span class="badge badge-status-info">${f.department || 'CSE'}</span></td>
          <td>${f.phone || '-'}</td>
          <td>
            <a href="/pages/admin/assignments.html" class="text-decoration-none">
              <span class="badge badge-status-yellow">${f.assignedCount} Courses</span>
            </a>
          </td>
          <td>
            <span class="badge ${f.active ? 'badge-status-green' : 'badge-status-red'}">${f.active ? 'ACTIVE' : 'INACTIVE'}</span>
          </td>
          <td>
            <div class="d-flex gap-1">
              <button class="btn btn-sm btn-glass btn-icon" onclick="openFacultyModal(${f.id})" title="Edit Faculty">
                <i class="fa-solid fa-pen-to-square"></i>
              </button>
              ${f.active ? `
                <button class="btn btn-sm btn-danger btn-icon" onclick="deactivateFaculty(${f.id}, '${f.name}')" title="Deactivate Faculty">
                  <i class="fa-solid fa-user-slash"></i>
                </button>
              ` : ''}
            </div>
          </td>
        </tr>
      `).join('');
    }

    function openFacultyModal(id = null) {
      document.getElementById('facultyForm').reset();
      document.getElementById('facultyId').value = '';

      if (id) {
        const f = allFaculty.find(item => item.id === id);
        if (!f) return;
        document.getElementById('facultyModalTitle').textContent = `Edit Faculty: ${f.name}`;
        document.getElementById('facultyId').value = f.id;
        document.getElementById('facultyNameInput').value = f.name;
        document.getElementById('facultyEmailInput').value = f.email;
        document.getElementById('facultyDeptInput').value = f.department || '';
        document.getElementById('facultyPhoneInput').value = f.phone || '';
      } else {
        document.getElementById('facultyModalTitle').textContent = 'Add Faculty Member';
      }

      facultyModalInstance.show();
    }

    document.getElementById('facultyForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const id = document.getElementById('facultyId').value;
      const payload = {
        name: document.getElementById('facultyNameInput').value.trim(),
        email: document.getElementById('facultyEmailInput').value.trim(),
        password: document.getElementById('facultyPasswordInput').value,
        department: document.getElementById('facultyDeptInput').value.trim(),
        phone: document.getElementById('facultyPhoneInput').value.trim()
      };

      const btn = document.getElementById('saveFacultyBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Saving...';

      try {
        const method = id ? 'PUT' : 'POST';
        const url = id ? `/api/admin/faculty/${id}` : '/api/admin/faculty';

        const res = await fetch(url, {
          method: method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          AppLayout.showToast(`Faculty record ${id ? 'updated' : 'created'} successfully`, 'success');
          facultyModalInstance.hide();
          loadFaculty();
        } else {
          const err = await res.json();
          AppLayout.showToast(err.message || 'Operation failed', 'error');
        }
      } catch (err) {
        console.error(err);
        AppLayout.showToast('Network error while saving faculty', 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'Save Record';
      }
    });

    async function deactivateFaculty(id, name) {
      if (!confirm(`Are you sure you want to deactivate ${name}? This performs a safe soft-delete without removing course assignments or historical logs.`)) {
        return;
      }

      try {
        const res = await fetch(`/api/admin/faculty/${id}`, { method: 'DELETE' });
        if (res.ok) {
          AppLayout.showToast(`Faculty member ${name} deactivated successfully`, 'success');
          loadFaculty();
        } else {
          const err = await res.json();
          AppLayout.showToast(err.message || 'Failed to deactivate faculty', 'error');
        }
      } catch (e) {
        console.error(e);
        AppLayout.showToast('Network error', 'error');
      }
    }
  </script>
</body>
</html>
