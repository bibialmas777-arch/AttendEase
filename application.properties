# ==============================================================================
# AttendEase - Application Configuration
# ==============================================================================

server.port=8080

# ------------------------------------------------------------------------------
# Database Configuration (MySQL / MariaDB)
# Change username/password here if running on a different environment
# ------------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/attendease?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# File Upload Configuration (for attendance grievance attachments)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
attendease.upload.dir=uploads/documents

# Logging
logging.level.com.attendease=INFO
logging.level.org.springframework.security=WARN

